server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/green_campus?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:green_campus}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
campus:
  alerts:
    collection-overdue-days: ${COLLECTION_OVERDUE_DAYS:7}
    collection-status-stale-days: ${COLLECTION_STATUS_STALE_DAYS:2}
    ewaste-handover-overdue-days: ${EWASTE_HANDOVER_OVERDUE_DAYS:14}
